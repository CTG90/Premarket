<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Premarket"/>
<title>Premarket Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#060810;color:#e5e7eb;min-height:100vh;padding-bottom:80px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.hdr{background:linear-gradient(180deg,#0d1428 0%,#080c18 100%);padding:52px 16px 14px;border-bottom:1px solid #1a2540;position:sticky;top:0;z-index:100}
.hdr-row{display:flex;justify-content:space-between;align-items:center}
.title{font-size:24px;font-weight:700;letter-spacing:-.04em;color:#fff}
.sub{font-size:11px;color:#4b5675;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;background:#0d1420;border:1px solid #1a2540;border-radius:8px;padding:5px 10px;font-size:11px;color:#6b7280}
.dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
.rbtn{background:#1e2d4a;border:1px solid #2d4470;color:#6b8fd4;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px}
.rbtn .ico{display:inline-block}
.rbtn.spinning .ico{animation:spin 1s linear infinite}
/* PREMARKET BANNER */
.pm-banner{background:#0a1a0a;border:1px solid #1a3a1a;border-radius:10px;padding:8px 12px;margin:8px 16px 0;font-size:11px;color:#4ade80;display:flex;align-items:center;gap:6px}
.pm-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1s infinite;flex-shrink:0}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 0}
.stat{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:8px;text-align:center}
.stat-v{font-size:18px;font-weight:700;color:#fff}
.stat-l{font-size:9px;color:#4b5675;margin-top:1px;text-transform:uppercase}
/* TABS */
.tabs{display:flex;gap:2px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:44px;padding:7px 3px;border-radius:8px;font-size:10px;font-weight:600;border:1px solid #1a2540;cursor:pointer;background:#0d1420;color:#4b5675;white-space:nowrap;text-align:center}
.tab.on{background:#3730a3;color:#fff;border-color:#4338ca}
/* FILTERS */
.fbar{display:flex;gap:5px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fp{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid #1a2540;background:#0d1420;color:#4b5675}
.fp.on{background:#3730a3;color:#fff;border-color:#4338ca}
.content{padding:8px 16px 0}
/* CARDS */
.card{background:#0d1420;border:1px solid #1a2540;border-radius:12px;margin-bottom:7px;overflow:hidden}
.card.open{border-color:#4338ca}
.ch{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ring{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:800}
.rh{background:rgba(16,185,129,.12);border:2px solid #10b981;color:#10b981}
.rm{background:rgba(99,102,241,.12);border:2px solid #6366f1;color:#818cf8}
.rl{background:rgba(245,158,11,.12);border:2px solid #f59e0b;color:#f59e0b}
.rs{background:rgba(239,68,68,.08);border:2px solid #ef4444;color:#ef4444}
.ci{flex:1;min-width:0}
.tk{font-size:14px;font-weight:700;color:#fff}
.nm{font-size:11px;color:#4b5675;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin-top:2px;display:inline-block}
.pgo{background:rgba(16,185,129,.15);color:#10b981}
.psw{background:rgba(99,102,241,.15);color:#818cf8}
.pfd{background:rgba(251,146,60,.15);color:#fb923c}
.pwt{background:rgba(245,158,11,.15);color:#f59e0b}
.psk{background:rgba(239,68,68,.1);color:#ef4444}
.cr2{text-align:right;flex-shrink:0}
.cc{font-size:15px;font-weight:700}
.up{color:#10b981}.dn{color:#ef4444}
.cp{font-size:11px;color:#6b7280;margin-top:1px}
/* DETAIL */
.det{padding:12px;border-top:1px solid #1a2540;animation:slidein .2s ease}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
.dc{background:#060810;border:1px solid #1a2540;border-radius:7px;padding:7px}
.dl{font-size:10px;color:#4b5675;margin-bottom:2px}
.dv{font-size:12px;font-weight:600;color:#fff}
.sigrow{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.sdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cg{color:#10b981}.dg2{background:#10b981}
.cy{color:#f59e0b}.dy2{background:#f59e0b}
.cr3{color:#ef4444}.dr2{background:#ef4444}
.sb{background:rgba(67,56,202,.15);border:1px solid rgba(67,56,202,.3);border-radius:8px;padding:9px;margin-top:7px}
.slb{font-size:10px;color:#818cf8;font-weight:600;margin-bottom:3px}
.st{font-size:12px;color:#c7d2fe;line-height:1.5}
.strike-btn{width:100%;margin-top:8px;padding:10px;background:#3730a3;border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
/* IV WIDGET */
.iv-bar{height:6px;border-radius:3px;background:#1a2540;margin:4px 0 2px;overflow:hidden}
.iv-fill{height:100%;border-radius:3px;transition:width .5s}
.iv-low{background:linear-gradient(90deg,#10b981,#34d399)}
.iv-mid{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.iv-high{background:linear-gradient(90deg,#ef4444,#f87171)}
/* RESISTANCE LEVELS */
.res-box{background:#1a0a0a;border:1px solid #3d1010;border-radius:8px;padding:8px;margin-top:7px}
.sup-box{background:#0a1a0a;border:1px solid #103d10;border-radius:8px;padding:8px;margin-top:5px}
.lvl-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.lvl-row:last-child{border:none}
/* STATUS */
.sbar{margin:8px 16px 0;border-radius:8px;padding:7px 11px;font-size:11px}
.slv{background:#0d1a10;border:1px solid #1a3a20;color:#4ade80}
.scl{background:#1a1200;border:1px solid #3d2e00;color:#f59e0b}
.ser{background:#1a0a0a;border:1px solid #3d1010;color:#f87171}
/* LOADING */
.ld{text-align:center;padding:40px 20px}
.sp{width:28px;height:28px;border:3px solid #1a2540;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
.es{text-align:center;padding:36px 20px;color:#4b5675}
.ei{font-size:32px;margin-bottom:8px}
.et{font-size:14px;font-weight:600;color:#6b7280;margin-bottom:5px}
.em{font-size:12px;line-height:1.8}
/* STRIKES */
.opt-hdr{background:#0d1a10;border:1px solid #1a3a20;border-radius:10px;padding:11px;margin-bottom:8px}
.opt-rec{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.tf-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block;margin-bottom:7px}
.tf0{background:rgba(239,68,68,.2);color:#f87171}
.tfw{background:rgba(245,158,11,.2);color:#fbbf24}
.tfm{background:rgba(99,102,241,.2);color:#818cf8}
.tfs{background:rgba(16,185,129,.2);color:#4ade80}
/* P&L CALC */
.calc-box{background:#0d1420;border:1px solid #1a2540;border-radius:12px;padding:14px;margin-bottom:8px}
.calc-input{width:100%;background:#060810;border:1px solid #1a2540;border-radius:8px;color:#fff;padding:9px 11px;font-size:14px;margin-bottom:8px;outline:none}
.calc-result{background:#0a1428;border:1px solid #1e3055;border-radius:10px;padding:12px;margin-top:10px}
.calc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calc-row:last-child{margin:0}
/* VIX */
.vix-box{background:#0d1420;border:1px solid #1a2540;border-radius:12px;padding:14px;margin-bottom:8px}
.vix-num{font-size:36px;font-weight:800;color:#fff}
.gauge{height:10px;border-radius:5px;background:linear-gradient(90deg,#10b981 0%,#f59e0b 50%,#ef4444 100%);margin:10px 0 6px;position:relative}
.gauge-marker{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #1a2540;transform:translateX(-50%);transition:left .5s}
/* EARNINGS */
.earn-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.earn-card.urgent{border-color:#ef4444;background:#1a0808}
.earn-card.soon{border-color:#f59e0b;background:#1a1200}
.earn-date{text-align:center;min-width:40px}
.earn-day{font-size:18px;font-weight:800;color:#fff}
.earn-mon{font-size:10px;color:#4b5675;margin-top:1px}
.earn-info{flex:1}
.earn-ticker{font-size:14px;font-weight:700;color:#fff}
.earn-time{font-size:11px;color:#4b5675;margin-top:1px}
.earn-warn{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px}
.ew-hot{background:rgba(239,68,68,.15);color:#f87171}
.ew-soon{background:rgba(245,158,11,.15);color:#f59e0b}
.ew-ok{background:rgba(107,114,128,.1);color:#9ca3af}
/* ECON CAL */
.econ-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.econ-impact-h{border-left:3px solid #ef4444}
.econ-impact-m{border-left:3px solid #f59e0b}
.econ-impact-l{border-left:3px solid #4b5675}
/* NEWS */
.news-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.ns-bull{background:rgba(16,185,129,.15);color:#10b981}
.ns-bear{background:rgba(239,68,68,.15);color:#ef4444}
.ns-neut{background:rgba(107,114,128,.15);color:#9ca3af}
/* FLOW */
.flow-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.flow-call{border-left:3px solid #10b981}
.flow-put{border-left:3px solid #ef4444}
/* POL */
.pol-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.ptb-buy{background:rgba(16,185,129,.15);color:#10b981}
.ptb-sell{background:rgba(239,68,68,.15);color:#ef4444}
.new-badge{background:rgba(239,68,68,.2);color:#f87171;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:5px}
/* COMMUNITY */
.comm-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.comm-rank{width:28px;height:28px;border-radius:50%;background:#1e2d4a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#818cf8;flex-shrink:0}
.comm-match{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);border-radius:7px;padding:6px 8px;margin-top:7px;font-size:11px;color:#4ade80}
/* WATCHLIST */
.wli{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.wlt{font-size:14px;font-weight:700;color:#fff}
.wln{font-size:11px;color:#4b5675;margin-top:1px}
.wlr{text-align:right}
.wlp{font-size:12px;color:#818cf8;font-weight:600}
.wle{font-size:11px;color:#4b5675;margin-top:1px}
/* PLAN */
.plan-card{background:#0d1a10;border:1px solid #1a3a20;border-radius:12px;margin-bottom:8px;padding:12px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}
.pc2{background:#060810;border:1px solid #1a2540;border-radius:7px;padding:7px}
.pl{font-size:10px;color:#4b5675;margin-bottom:1px}
.pv{font-size:12px;font-weight:600;color:#fff}
.ptip{background:rgba(67,56,202,.15);border:1px solid rgba(67,56,202,.3);border-radius:7px;padding:7px;margin-top:7px;font-size:11px;color:#c7d2fe;line-height:1.5}
.hbadge{background:rgba(239,68,68,.15);color:#f87171;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block;margin-bottom:5px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="title">Premarket Pro</div>
      <div class="sub" id="mktStatus">Options Intelligence</div>
    </div>
    <div style="text-align:right">
      <span class="badge"><span class="dot"></span><span id="clk">--:--</span> ET</span><br>
      <button class="rbtn" id="rb" onclick="go()"><span class="ico">↻</span> Refresh</button>
    </div>
  </div>
</div>

<div id="pmBanner" class="pm-banner" style="display:none">
  <span class="pm-dot"></span><span id="pmMsg">Premarket active</span>
</div>
<div id="sb" class="sbar scl" style="display:none"></div>

<div class="stats">
  <div class="stat"><div class="stat-v" id="sT">--</div><div class="stat-l">Tickers</div></div>
  <div class="stat"><div class="stat-v" id="sH" style="color:#10b981">--</div><div class="stat-l">Hot</div></div>
  <div class="stat"><div class="stat-v" id="sVix" style="color:#f59e0b">--</div><div class="stat-l">VIX</div></div>
  <div class="stat"><div class="stat-v" id="sFG" style="color:#818cf8">--</div><div class="stat-l">F&amp;G</div></div>
</div>

<div class="tabs">
  <button class="tab on" onclick="sw('movers',this)">🔥 Movers</button>
  <button class="tab" onclick="sw('strikes',this)">⚡ Strikes</button>
  <button class="tab" onclick="sw('calc',this)">🧮 P&amp;L</button>
  <button class="tab" onclick="sw('earn',this)">📅 Earn</button>
  <button class="tab" onclick="sw('econ',this)">🌐 Macro</button>
  <button class="tab" onclick="sw('comm',this)">👥 Crowd</button>
  <button class="tab" onclick="sw('news',this)">📰 News</button>
  <button class="tab" onclick="sw('flow',this)">💰 Flow</button>
  <button class="tab" onclick="sw('pols',this)">🏛 Pol</button>
  <button class="tab" onclick="sw('plan',this)">📋 Plan</button>
  <button class="tab" onclick="sw('wl',this)">👁 List</button>
</div>

<!-- MOVERS -->
<div id="t-movers">
  <div class="fbar">
    <button class="fp on" onclick="sf('all',this)">All</button>
    <button class="fp" onclick="sf('go',this)">🚀 Gap Go</button>
    <button class="fp" onclick="sf('sw2',this)">📅 Swing</button>
    <button class="fp" onclick="sf('fd',this)">🔴 Puts</button>
    <button class="fp" onclick="sf('wt',this)">👀 Watch</button>
  </div>
  <div class="content" id="mc">
    <div class="ld"><div class="sp"></div><div style="font-size:13px;color:#4b5675">Loading market data...</div></div>
  </div>
</div>
<!-- STRIKES -->
<div id="t-strikes" style="display:none">
  <div class="content" id="stc">
    <div class="es"><div class="ei">⚡</div><div class="et">Strike Recommender</div><div class="em">Expand any stock in Movers<br>tap Get Strike Recommendations</div></div>
  </div>
</div>
<!-- P&L CALCULATOR -->
<div id="t-calc" style="display:none">
  <div class="content">
    <div style="font-size:11px;color:#4b5675;margin:6px 0 8px">Options P&L Calculator — know your target before you enter</div>
    <div class="calc-box">
      <label style="font-size:11px;color:#4b5675">Stock Ticker</label>
      <input class="calc-input" id="cTicker" placeholder="e.g. NVDA" oninput="autoFillCalc()"/>
      <label style="font-size:11px;color:#4b5675">Current Stock Price ($)</label>
      <input class="calc-input" id="cStock" type="number" placeholder="e.g. 221.00" oninput="calcPL()"/>
      <label style="font-size:11px;color:#4b5675">Strike Price ($)</label>
      <input class="calc-input" id="cStrike" type="number" placeholder="e.g. 230" oninput="calcPL()"/>
      <label style="font-size:11px;color:#4b5675">Premium Paid ($ per contract)</label>
      <input class="calc-input" id="cPrem" type="number" placeholder="e.g. 2.50" oninput="calcPL()"/>
      <label style="font-size:11px;color:#4b5675">Number of Contracts</label>
      <input class="calc-input" id="cContracts" type="number" value="1" oninput="calcPL()"/>
      <label style="font-size:11px;color:#4b5675">Days to Expiry (DTE)</label>
      <input class="calc-input" id="cDTE" type="number" placeholder="e.g. 14" oninput="calcPL()"/>
      <div id="calcResult"></div>
    </div>
  </div>
</div>
<!-- EARNINGS -->
<div id="t-earn" style="display:none">
  <div class="content" id="earnc"></div>
</div>
<!-- MACRO / ECON -->
<div id="t-econ" style="display:none">
  <div class="content" id="econc"></div>
</div>
<!-- COMMUNITY WATCH -->
<div id="t-comm" style="display:none">
  <div class="fbar" id="commFilters">
    <button class="fp on" onclick="filterComm('all',this)">All</button>
    <button class="fp" onclick="filterComm('match',this)">⭐ On My List</button>
    <button class="fp" onclick="filterComm('call',this)">🟢 Call Bias</button>
    <button class="fp" onclick="filterComm('put',this)">🔴 Put Bias</button>
  </div>
  <div class="content" id="commc"></div>
</div>
<!-- NEWS -->
<div id="t-news" style="display:none">
  <div class="fbar">
    <button class="fp on" onclick="filterNews('all',this)">All</button>
    <button class="fp" onclick="filterNews('bull',this)">🟢 Bullish</button>
    <button class="fp" onclick="filterNews('bear',this)">🔴 Bearish</button>
    <button class="fp" onclick="filterNews('earn',this)">📅 Earnings</button>
  </div>
  <div class="content" id="nc"><div class="ld"><div class="sp"></div><div style="font-size:13px;color:#4b5675">Loading news...</div></div></div>
</div>
<!-- FLOW -->
<div id="t-flow" style="display:none">
  <div class="content" id="flc"><div class="ld"><div class="sp"></div><div style="font-size:13px;color:#4b5675">Analyzing flow...</div></div></div>
</div>
<!-- POL TRADES -->
<div id="t-pols" style="display:none">
  <div class="fbar">
    <button class="fp on" onclick="sortPols('new',this)">🕐 Newest</button>
    <button class="fp" onclick="sortPols('old',this)">🕐 Oldest</button>
    <button class="fp" onclick="sortPols('wl',this)">⭐ Watchlist</button>
    <button class="fp" onclick="sortPols('buy',this)">🟢 Buys</button>
    <button class="fp" onclick="sortPols('sell',this)">🔴 Sells</button>
  </div>
  <div class="content" id="polc"><div class="ld"><div class="sp"></div></div></div>
</div>
<!-- PLAN -->
<div id="t-plan" style="display:none"><div class="content" id="pc"></div></div>
<!-- WATCHLIST -->
<div id="t-wl" style="display:none"><div class="content" id="wc"></div></div>

// ── FETCH PRICE ───────────────────────────────────────────────────
async function fetchQ(ticker){
  var v7='https://query1.finance.yahoo.com/v7/finance/quote?symbols='+ticker;
  var v8='https://query1.finance.yahoo.com/v8/finance/chart/'+ticker+'?interval=1d&range=5d';
  var urls=[v7,v8,'https://corsproxy.io/?'+encodeURIComponent(v7),'https://corsproxy.io/?'+encodeURIComponent(v8),'https://api.allorigins.win/raw?url='+encodeURIComponent(v7),'https://api.allorigins.win/raw?url='+encodeURIComponent(v8)];
  for(var i=0;i<urls.length;i++){
    try{
      var r=await fetch(urls[i],{signal:AbortSignal.timeout(8000)});
      if(!r.ok) continue;
      var txt=await r.text();
      var d;try{d=JSON.parse(txt)}catch(e){continue}
      if(d&&d.quoteResponse&&d.quoteResponse.result&&d.quoteResponse.result[0]){
        var q=d.quoteResponse.result[0];
        var price=q.regularMarketPrice,prev=q.regularMarketPreviousClose||price;
        if(!price||price===0) continue;
        var wm=WL.find(function(w){return w.t===ticker});
        return{ticker:ticker,name:(wm?wm.n:null)||q.longName||ticker,
          price:Math.round(price*100)/100,pct:Math.round((q.regularMarketChangePercent||0)*100)/100,
          change:Math.round((q.regularMarketChange||0)*100)/100,prev:Math.round(prev*100)/100,
          high:q.regularMarketDayHigh||null,low:q.regularMarketDayLow||null,
          vol:q.regularMarketVolume||null,avgVol:q.averageDailyVolume3Month||null};
      }
      if(d&&d.chart&&d.chart.result&&d.chart.result[0]){
        var m=d.chart.result[0].meta,price=m.regularMarketPrice||m.previousClose,prev=m.previousClose||price;
        if(!price||price===0) continue;
        var pct=m.regularMarketChangePercent!=null?m.regularMarketChangePercent:((price-prev)/prev*100);
        var wm=WL.find(function(w){return w.t===ticker});
        return{ticker:ticker,name:(wm?wm.n:null)||ticker,
          price:Math.round(price*100)/100,pct:Math.round(pct*100)/100,
          change:Math.round((price-prev)*100)/100,prev:Math.round(prev*100)/100,
          high:m.regularMarketDayHigh||null,low:m.regularMarketDayLow||null,
          vol:m.regularMarketVolume||null,avgVol:m.averageDailyVolume3Month||null};
      }
    }catch(e){continue}
  }
  return null;
}

async function fetchVIX(){
  var q=await fetchQ('%5EVIX');

}

// ── SCORE ─────────────────────────────────────────────────────────
function getLevels(ticker,price){
  var wl=WL.find(function(w){return w.t===ticker});
  if(!wl||!wl.res) return null;
  var nearRes=wl.res.filter(function(r){return r>price}).sort(function(a,b){return a-b})[0]||null;
  var nearSup=wl.sup.filter(function(s){return s<price}).sort(function(a,b){return b-a})[0]||null;
  return{resistance:wl.res,support:wl.sup,nearRes:nearRes,nearSup:nearSup,
    distRes:nearRes?((nearRes-price)/price*100):null,
    distSup:nearSup?((price-nearSup)/price*100):null,
    nearResistance:!!(nearRes&&((nearRes-price)/price*100)<3),
    nearSupport:!!(nearSup&&((price-nearSup)/price*100)<2)};
}

function getIV(ticker){
  var wl=WL.find(function(w){return w.t===ticker});
  return wl?wl.ivEst:50;
}

function ivLabel(iv){
  if(iv>=80) return{l:'Very High · Use Spreads',c:'#ef4444',cls:'iv-high',rec:'IV '+iv+' — Premiums expensive. Use bull call spread instead of naked calls.'};
  if(iv>=55) return{l:'Elevated · Consider Spreads',c:'#f59e0b',cls:'iv-mid',rec:'IV '+iv+' — Above average. Spreads cut cost 30-40%. Naked calls still viable on strong setups.'};
  return{l:'Low · Buy Naked Calls',c:'#10b981',cls:'iv-low',rec:'IV '+iv+' — Cheap premiums. Best time to buy naked calls/puts. Load up on directional plays.'};
}

function scoreM(m){
  var s=0,sigs=[],gap=Math.abs(m.pct);
  var wl=WL.find(function(w){return w.t===m.ticker});
  var rv=m.vol&&m.avgVol?m.vol/m.avgVol:1;
  var lv=getLevels(m.ticker,m.price);
  var iv=getIV(m.ticker);
  // Gap score
  if(gap>=4&&gap<=7){s+=25;sigs.push({t:'Gap '+gap.toFixed(1)+'% Ideal range',c:'g'})}
  else if(gap>7&&gap<=12){s+=20;sigs.push({t:'Gap '+gap.toFixed(1)+'% Strong momentum',c:'g'})}
  else if(gap>12&&gap<=20){s+=12;sigs.push({t:'Gap '+gap.toFixed(1)+'% watch reversal',c:'y'})}
  else if(gap>20){s+=5;sigs.push({t:'Gap '+gap.toFixed(1)+'% high reversal risk',c:'r'})}
  else if(gap>=1){s+=8;sigs.push({t:'Gap '+gap.toFixed(1)+'% minor',c:'y'})}
  else{s+=2;sigs.push({t:'Flat',c:'r'})}
  // Volume
  if(rv>=3){s+=20;sigs.push({t:'Vol '+rv.toFixed(1)+'x Institutional',c:'g'})}
  else if(rv>=2){s+=15;sigs.push({t:'Vol '+rv.toFixed(1)+'x Strong',c:'g'})}
  else if(rv>=1.5){s+=10;sigs.push({t:'Vol '+rv.toFixed(1)+'x moderate',c:'y'})}
  else{s+=4;sigs.push({t:'Vol '+rv.toFixed(1)+'x weak',c:'r'})}
  // Watchlist
  if(wl){s+=20;sigs.push({t:'On watchlist · target '+wl.tgt,c:'g'})}
  else{s+=5;sigs.push({t:'Not on core watchlist',c:'y'})}
  // Resistance awareness
  if(lv){
    if(lv.nearResistance&&m.pct>0){s-=8;sigs.push({t:'Near resistance $'+lv.nearRes+' ('+lv.distRes.toFixed(1)+'%) · PUT alert',c:'r'})}
    else if(lv.nearSupport&&m.pct<0){s+=10;sigs.push({t:'Bouncing from support $'+lv.nearSup+' · CALL opp',c:'g'})}
    else if(m.pct>0&&lv.nearRes){sigs.push({t:'Next resistance $'+lv.nearRes+' ('+lv.distRes.toFixed(1)+'%)',c:'y'})}
    else if(m.pct<0&&lv.nearSup){sigs.push({t:'Support at $'+lv.nearSup+' ('+lv.distSup.toFixed(1)+'% below)',c:'y'})}
  }
  // IV
  if(iv>=80){sigs.push({t:'IV '+iv+' · use spreads not naked calls',c:'r'})}
  else if(iv>=55){sigs.push({t:'IV '+iv+' · elevated · spreads recommended',c:'y'})}
  else{sigs.push({t:'IV '+iv+' · cheap premiums · good to buy',c:'g'})}
  if(m.pct>0){s+=10;sigs.push({t:'Gapping UP · bullish',c:'g'})}
  else{s+=8;sigs.push({t:'Gapping DOWN · put setup',c:'y'})}
  if(m.price>=5&&m.price<=700){s+=10;sigs.push({t:'$'+m.price+' good options range',c:'g'})}
  var play,pc,strat;
  var nearRes=lv&&lv.nearResistance&&m.pct>0;
  if(nearRes){play='Resistance Put';pc='pfd';strat='Near resistance $'+lv.nearRes+'. Watch for rejection. Buy OTM puts if stalls at open. Target $'+lv.nearSup+'.'}
  else if(s>=70&&m.pct>0){play='Gap & Go';pc='pgo';strat='Strong gap + volume. Buy OTM calls 9:35 AM if holds premarket high. '+(wl?wl.strat:'')}
  else if(s>=55&&m.pct>0){play='Swing Calls';pc='psw';strat='Wait 30 min. '+(wl?'Entry: '+wl.entry+' Target: '+wl.tgt:'Monthly OTM calls 30-45 DTE.')}
  else if(s>=40&&m.pct<0&&gap>3){play='Puts Setup';pc='pfd';strat='Gap down. Buy OTM puts on rejection. Target support '+(lv&&lv.nearSup?'$'+lv.nearSup:'key level')+'.'}
  else if(s>=35){play='Watch';pc='pwt';strat='Monitor first 30 min. Enter on volume confirmation.'}
  else{play='Skip';pc='psk';strat='Low conviction. Pass.'}
  return{s:Math.max(0,Math.min(100,s)),sigs:sigs,play:play,pc:pc,strat:strat,wl:wl,rv:rv,lv:lv,iv:iv};
}

// ── RENDER MOVERS ─────────────────────────────────────────────────
function render(){
  var list=movers.map(function(m){return Object.assign({},m,scoreM(m))});
  if(filt!=='all'){
    list=list.filter(function(m){
      if(filt==='go') return m.play==='Gap & Go';
      if(filt==='sw2') return m.play==='Swing Calls';
      if(filt==='fd') return m.play==='Puts Setup'||m.play==='Resistance Put';
      if(filt==='wt') return m.play==='Watch'||m.play==='Skip';
      return true;
    });
  }
  if(!list.length){document.getElementById('mc').innerHTML='<div class="es"><div class="ei">🔍</div><div class="et">No matches</div></div>';return}
  document.getElementById('mc').innerHTML=list.map(buildCard).join('');
}

function calcPL(){
  var stock=parseFloat(document.getElementById('cStock').value)||0;
  var strike=parseFloat(document.getElementById('cStrike').value)||0;
  var prem=parseFloat(document.getElementById('cPrem').value)||0;

  var dte=parseInt(document.getElementById('cDTE').value)||30;
  if(!stock||!strike||!prem){document.getElementById('calcResult').innerHTML='';return}
  var totalCost=prem*contracts*100;
  var breakeven=strike+prem;
  var t20=prem*1.2,t50=prem*1.5,t100=prem*2,t200=prem*3;
  // Stock price needed for each target
  var sp20=strike+t20,sp50=strike+t50,sp100=strike+t100,sp200=strike+t200;
  var pct20=((sp20-stock)/stock*100).toFixed(1);
  var pct50=((sp50-stock)/stock*100).toFixed(1);
  var pct100=((sp100-stock)/stock*100).toFixed(1);

// ── NEWS ──────────────────────────────────────────────────────────
async function fetchNews(){
  var items=[];
  var tickers=WL.map(function(w){return w.t});
  for(var i=0;i<tickers.length;i++){
    var t=tickers[i];
    var rss='https://feeds.finance.yahoo.com/rss/2.0/headline?s='+t+'&region=US&lang=en-US';
    var proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(rss);
    try{
      var r=await fetch(proxy,{signal:AbortSignal.timeout(8000)});
      if(!r.ok) continue;
      var xml=await r.text();
      var parser=new DOMParser(),doc=parser.parseFromString(xml,'text/xml');
      var nodes=doc.querySelectorAll('item');
      for(var j=0;j<Math.min(nodes.length,3);j++){
        var node=nodes[j];
        var title=(node.querySelector('title')||{}).textContent||'';
        var pub=(node.querySelector('pubDate')||{}).textContent||'';
        if(title){
          var sent=analyzeSentiment(title);
          items.push({ticker:t,title:title,pub:pub,sentiment:sent.signal,trade:sent.trade,category:sent.cat,age:timeAgo(pub)});
        }
      }
      await wait(80);
    }catch(e){continue}
  }
  items.sort(function(a,b){return new Date(b.pub)-new Date(a.pub)});
  return items;
}

function analyzeSentiment(text){
  var t=text.toLowerCase();
  var bull=['beat','beats','record','surge','rally','jump','soar','upgrade','strong','growth','beat','raised','top','exceeded','breakout','contract','deal','win','profit','buy'];
  var bear=['miss','misses','fell','fall','drop','decline','downgrade','weak','loss','cut','below','warning','lawsuit','investigation','short','concern','risk','layoff'];
  var earn=['earnings','eps','revenue','quarter','q1','q2','q3','q4','guidance'];
  var bs=0,br=0;
  bull.forEach(function(w){if(t.indexOf(w)>-1)bs++});
  bear.forEach(function(w){if(t.indexOf(w)>-1)br++});
  var isE=earn.some(function(w){return t.indexOf(w)>-1});
  if(bs>br) return{signal:'bull',trade:'Bullish signal. Consider OTM calls if above support and confirms at open.',cat:isE?'earn':'news'};
  if(br>bs) return{signal:'bear',trade:'Bearish signal. Watch for resistance rejection. OTM puts if fails support.',cat:isE?'earn':'news'};
  return{signal:'neut',trade:'Neutral. Wait for price action confirmation.',cat:isE?'earn':'news'};
}

function renderFlow(){
  if(movers.length===0){document.getElementById('flc').innerHTML='<div class="es"><div class="ei">💰</div><div class="et">No flow data</div><div class="em">Tap Refresh in Movers first</div></div>';return}
  var flows=[];
  for(var i=0;i<movers.length;i++){
    var m=movers[i],wl=WL.find(function(w){return w.t===m.ticker});
    if(!wl) continue;
    var rv=m.vol&&m.avgVol?m.vol/m.avgVol:1;
    if(rv>=1.5||Math.abs(m.pct)>=2){
      var isCall=m.pct>=0;
      var prem=Math.round((m.price*0.02+Math.abs(m.pct)*50000)/1000)*1000;
      flows.push({ticker:m.ticker,name:wl.n,type:isCall?'CALL':'PUT',
        strike:isCall?roundStrike(m.price*1.03):roundStrike(m.price*0.97),
        expiry:nextFriday(),premium:prem,volume:Math.round(rv*2500),rv:rv,pct:m.pct,price:m.price,
        isHot:rv>=2||Math.abs(m.pct)>=4,
        signal:(isCall?'Unusual call buying. ':'Unusual put buying. ')+rv.toFixed(1)+'x avg volume. '+(isCall?'Follow with OTM calls.':'Consider OTM puts.')});
    }
  }
  flows.sort(function(a,b){return(b.isHot-a.isHot)||(b.rv-a.rv)});
  if(!flows.length){document.getElementById('flc').innerHTML='<div class="es"><div class="ei">💰</div><div class="et">Quiet day</div><div class="em">No unusual flow signals. Markets may be slow.</div></div>';return}
  var h='<div style="font-size:11px;color:#4b5675;margin:6px 0 8px">'+flows.length+' unusual flow signals · Based on volume + price action</div>';
  for(var i=0;i<flows.length;i++){
    var f=flows[i],isCall=f.type==='CALL';
    h+='<div class="flow-card '+(isCall?'flow-call':'flow-put')+'">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">';
    h+='<div><div style="font-size:14px;font-weight:700;color:#fff">'+f.ticker+(f.isHot?'<span style="font-size:9px;background:rgba(239,68,68,.2);color:#f87171;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:5px">HOT</span>':'')+'</div>';
    h+='<div style="font-size:11px;color:#4b5675">'+f.name+'</div></div>';
    h+='<div style="text-align:right"><span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:'+(isCall?'rgba(16,185,129,.15)':'rgba(239,68,68,.15)')+';color:'+(isCall?'#10b981':'#ef4444')+'">'+f.type+'</span>';
    h+='<div style="font-size:11px;color:#4b5675;margin-top:3px">$'+f.strike+' · '+f.expiry+'</div></div></div>';
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:7px">';
    h+='<div style="background:#060810;border:1px solid #1a2540;border-radius:6px;padding:6px;text-align:center"><div style="font-size:12px;font-weight:700;color:#fff">$'+f.premium.toLocaleString()+'</div><div style="font-size:10px;color:#4b5675">Premium</div></div>';
    h+='<div style="background:#060810;border:1px solid #1a2540;border-radius:6px;padding:6px;text-align:center"><div style="font-size:12px;font-weight:700;color:#fff">'+f.volume.toLocaleString()+'</div><div style="font-size:10px;color:#4b5675">Volume</div></div>';
    h+='<div style="background:#060810;border:1px solid #1a2540;border-radius:6px;padding:6px;text-align:center"><div style="font-size:12px;font-weight:700;color:#fff">'+f.rv.toFixed(1)+'x</div><div style="font-size:10px;color:#4b5675">Rel Vol</div></div>';
    h+='</div>';
    h+='<div style="background:rgba(67,56,202,.15);border:1px solid rgba(67,56,202,.3);border-radius:7px;padding:7px;font-size:11px;color:#c7d2fe">💡 '+f.signal+'</div>';
    h+='</div>';
  }
  document.getElementById('flc').innerHTML=h;
}

async function loadPols(){
  document.getElementById('polc').innerHTML='<div class="ld"><div class="sp"></div><div style="font-size:13px;color:#4b5675">Fetching congressional trades...</div></div>';
  var trades=[];
  var urls=['https://corsproxy.io/?'+encodeURIComponent('https://house-stock-watcher-data.s3-us-east-2.amazonaws.com/data/all_transactions.json'),'https://api.allorigins.win/raw?url='+encodeURIComponent('https://house-stock-watcher-data.s3-us-east-2.amazonaws.com/data/all_transactions.json')];
  for(var i=0;i<urls.length;i++){
    try{
      var r=await fetch(urls[i],{signal:AbortSignal.timeout(15000)});
      if(!r.ok) continue;
      var data=await r.json();
      if(!Array.isArray(data)) continue;
      var cutoff=new Date();cutoff.setDate(cutoff.getDate()-60);
      var recent=data.filter(function(t){return new Date(t.transaction_date)>cutoff&&t.ticker&&t.ticker!=='--'}).slice(0,100);
      for(var j=0;j<recent.length;j++){
        var t2=recent[j];
        var wl=WL.find(function(w){return w.t===t2.ticker});
        var key=t2.transaction_date+(t2.representative||'')+(t2.ticker||'');
        trades.push({name:t2.representative||'Congress Member',ticker:t2.ticker||'',type:t2.type||'purchase',amount:t2.amount||'$1K-$15K',date:t2.transaction_date,isBuy:!t2.type||t2.type.indexOf('purchase')>-1,isNew:seenPols.indexOf(key)<0,age:timeAgo(t2.disclosure_date||t2.transaction_date),onWatchlist:!!wl,signal:wl?(t2.type&&t2.type.indexOf('sale')>-1?'Congress SELLING '+t2.ticker+' — monitor for weakness.':'Congress BUYING '+t2.ticker+' — on watchlist. Target '+wl.tgt+'. Consider '+wl.strat+'.'):('Congress '+(t2.type&&t2.type.indexOf('sale')>-1?'selling':'buying')+' '+t2.ticker+'.')});
      }
      trades.forEach(function(t3){var k=t3.date+t3.name+t3.ticker;if(seenPols.indexOf(k)<0)seenPols.push(k)});
      try{localStorage.setItem('sp',JSON.stringify(seenPols.slice(-200)))}catch(e){}
      break;
    }catch(e){continue}
  }
  polTrades=trades.length>0?trades:POL_FALLBACK;
  renderPolsSorted(polTrades);
}

function sortPols(mode,btn){
  polSort=mode;

  else loadPols();
}

function renderPolsSorted(trades){
  var sorted=trades.slice();
  if(polSort==='new') sorted.sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  else if(polSort==='old') sorted.sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  else if(polSort==='wl') sorted.sort(function(a,b){return(b.onWatchlist?1:0)-(a.onWatchlist?1:0)});
  else if(polSort==='buy') sorted=sorted.filter(function(t){return t.isBuy});
  else if(polSort==='sell') sorted=sorted.filter(function(t){return!t.isBuy});
  var newCount=sorted.filter(function(t){return t.isNew}).length;
  var h='';
  if(newCount){h+='<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:9px;margin-bottom:8px;font-size:12px;color:#f87171;font-weight:600">🔔 '+newCount+' NEW disclosure'+(newCount>1?'s':'')+' since last visit</div>'}
  h+='<div style="font-size:11px;color:#4b5675;margin:4px 0 8px">'+sorted.length+' trades · 45-day disclosure lag · '+
    (polSort==='new'?'Newest first':polSort==='old'?'Oldest first':polSort==='wl'?'Watchlist first':polSort==='buy'?'Buys only':'Sells only')+'</div>';
  if(!sorted.length){h+='<div class="es"><div class="ei">🔍</div><div class="et">No trades match</div></div>'}
  for(var i=0;i<sorted.length;i++){
    var t=sorted[i];
    h+='<div class="pol-card">';
    h+='<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px">';
    h+='<div><div style="font-size:13px;font-weight:700;color:#fff">'+t.name+(t.isNew?'<span style="font-size:9px;background:rgba(239,68,68,.2);color:#f87171;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:5px">NEW</span>':'')+'</div>';
    h+='<div style="font-size:11px;color:#4b5675;margin-top:1px">Traded: '+t.date+' · '+t.age+'</div></div>';
    h+='<span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px" class="'+(t.isBuy?'ptb-buy':'ptb-sell')+'">'+t.type.toUpperCase()+'<br>'+t.ticker+'</span></div>';
    h+='<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px">';
    h+='<span style="font-size:11px;background:rgba(255,255,255,.05);border-radius:5px;padding:2px 7px;color:#9ca3af">'+t.amount+'</span>';
    if(t.onWatchlist){h+='<span style="font-size:11px;background:rgba(99,102,241,.15);border-radius:5px;padding:2px 7px;color:#818cf8">⭐ On watchlist</span>'}
    h+='</div>';
    h+='<div style="background:rgba(67,56,202,.15);border:1px solid rgba(67,56,202,.3);border-radius:7px;padding:7px;font-size:11px;color:#c7d2fe">💡 '+t.signal+'</div>';
    h+='</div>';
  }
  document.getElementById('polc').innerHTML=h;
}

// ── AUTO REFRESH ──────────────────────────────────────────────────
function updatePMBanner(){
  var et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  var d=et.getDay(),mins=et.getHours()*60+et.getMinutes();
  var banner=document.getElementById('pmBanner');
  if(!banner) return;
  if(d===0||d===6){banner.style.display='none';return}
  if(mins>=240&&mins<570){banner.style.display='flex';document.getElementById('pmMsg').textContent='PREMARKET ACTIVE · Auto-refresh every 5 min · Opens 9:30 AM ET'}
  else if(mins>=570&&mins<960){banner.style.display='flex';document.getElementById('pmMsg').textContent='MARKET OPEN · Live data · Auto-refresh every 5 min'}
  else{banner.style.display='none'}
}
setInterval(updatePMBanner,30000);
setInterval(function(){
  var et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  var d=et.getDay(),m2=et.getHours()*60+et.getMinutes();
  if(d>0&&d<6&&m2>=240&&m2<960) go();
},5*60*1000);

function setLoad(msg){document.getElementById('mc').innerHTML='<div class="ld"><div class="sp"></div><div style="font-size:13px;color:#4b5675">'+msg+'</div></div>'}
function setStat(msg,cls){var b=document.getElementById('sb');if(!msg){b.style.display='none';return}b.style.display='block';b.className='sbar '+(cls||'scl');b.textContent=msg}
function mktOpen(){var et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));var d=et.getDay(),m2=et.getHours()*60+et.getMinutes();return d>0&&d<6&&m2>=570&&m2<960}
function roundStrike(p){if(p>=500)return Math.round(p/10)*10;if(p>=100)return Math.round(p/5)*5;if(p>=20)return Math.round(p/2)*2;return Math.round(p)}
function nextFriday(){var d=new Date(),day=d.getDay(),diff=day<=5?5-day:6;d.setDate(d.getDate()+(diff===0?7:diff));return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function monthlyExp(){var d=new Date();d.setMonth(d.getMonth()+1);d.setDate(1);var fri=0;while(fri<3){if(d.getDay()===5)fri++;if(fri<3)d.setDate(d.getDate()+1);}return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function swing45(){var d=new Date();d.setDate(d.getDate()+45);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function timeAgo(s){try{var diff=Date.now()-new Date(s).getTime(),m=Math.floor(diff/60000);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}catch(e){return'Recently'}}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function tick(){var et=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));document.getElementById('clk').textContent=String(et.getHours()).padStart(2,'0')+':'+String(et.getMinutes()).padStart(2,'0');var d=et.getDay(),m2=et.getHours()*60+et.getMinutes();document.getElementById('mktStatus').textContent=d===0||d===6?'Weekend':m2>=570&&m2<960?'Market Open':m2>=240&&m2<570?'Premarket':'After Hours'}
setInterval(tick,1000);tick();
renderWL();renderPlan();renderEarn();renderEcon();renderComm();updatePMBanner();go();
